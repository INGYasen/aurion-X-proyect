# ─────────────────────────────────────────────────────────────────────────────
# FILTRO POR DÍA DE SEMANA
# Domingo (6) y Lunes (0) son los días más volátiles e impredecibles.
# - Domingo: mercado recién abierto, gaps, poca liquidez → NO operar.
# - Lunes: alta volatilidad, reversals frecuentes → lote mínimo, umbrales altos.
# - Martes-Viernes: operación normal.
# ─────────────────────────────────────────────────────────────────────────────
weekday_filters:
  0:  # Lunes – muy volátil, solo operar si la señal es excepcional
    enabled: true
    lot_factor: 0.3          # 30% del lote normal
    ml_threshold_increase: 0.15   # +15% al umbral ML → solo señales muy sólidas
    max_trades_per_symbol: 1      # máximo 1 entrada por símbolo en todo el día
    require_mtf_full_align: true  # exigir alineación M1+M5+M15 en lugar de M1+M5
    skip_setups: ["RANGE_FADE", "RANGE_BREAKOUT_MOMENTUM"]  # setups de alto riesgo bloqueados
  1:  # Martes – operación completamente normal
    enabled: true
    lot_factor: 1.0
    ml_threshold_increase: 0.0
    max_trades_per_symbol: 99
    require_mtf_full_align: false
    skip_setups: []
  2:  # Miércoles – operación normal
    enabled: true
    lot_factor: 1.0
    ml_threshold_increase: 0.0
    max_trades_per_symbol: 99
    require_mtf_full_align: false
    skip_setups: []
  3:  # Jueves – operación normal
    enabled: true
    lot_factor: 1.0
    ml_threshold_increase: 0.0
    max_trades_per_symbol: 99
    require_mtf_full_align: false
    skip_setups: []
  4:  # Viernes – normal, pero precaución al cierre (volatilidad por cierre semanal)
    enabled: true
    lot_factor: 0.85
    ml_threshold_increase: 0.04
    max_trades_per_symbol: 99
    require_mtf_full_align: false
    skip_setups: []
  5:  # Sábado – sin trading (mercado cerrado o muy ilíquido)
    enabled: false
    lot_factor: 0.0
    ml_threshold_increase: 0.0
    max_trades_per_symbol: 0
    require_mtf_full_align: true
    skip_setups: ["ALL"]
  6:  # Domingo – apertura de mercado, extremadamente peligroso → NO operar
    enabled: false
    lot_factor: 0.0
    ml_threshold_increase: 0.0
    max_trades_per_symbol: 0
    require_mtf_full_align: true
    skip_setups: ["ALL"]
