[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurion-x-3-0"
version = "0.1.0"
description = "AURION X 3.0 — trading algorítmico con ML"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9",
    "scikit-learn>=1.3,<2",
    "numpy>=1.26,<3",
    "MetaTrader5>=5.0.45",
]

[tool.setuptools.packages.find]
include = [
    "core",
    "market",
    "strategy",
    "execution",
    "risk",
    "ml",
    "ml.envs",
    "analytics",
    "market_structure",
    "data_pipeline",
]

[project.scripts]
aurion-x = "core.main:main"
aurion-train-model = "core.train_model:main"
aurion-dashboard = "analytics.dashboard_server:run_dashboard"

[project.optional-dependencies]
quant = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
]
dev = [
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
# AURION X 4.0 HYBRID: Transformer (PatchTST) + DRL (PPO) + Anomaly AE +
# statistical gates (DSR/PBO). Instalar con: pip install -e .[v4]
# Torch wheel CUDA 12.4 disponible para Python 3.13 (NVIDIA RTX 5060 verified).
v4 = [
    "torch>=2.5",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "requests>=2.31",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
