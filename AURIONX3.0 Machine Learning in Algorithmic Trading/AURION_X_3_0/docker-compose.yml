name: aurionx-db-primary

services:
  postgres:
    image: postgres:15
    container_name: aurionx_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aurion
      POSTGRES_PASSWORD: aurion123
      POSTGRES_DB: aurionx
    volumes:
      - aurionx_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurion -d aurionx"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Opcional: quitar este servicio si no necesitas UI; UI en http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aurionx_pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aurion.com
      PGADMIN_DEFAULT_PASSWORD: aurion123
    volumes:
      - aurionx_pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aurionx_data:
  aurionx_pgadmin:
